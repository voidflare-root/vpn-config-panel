<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VPN Config Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Login Screen -->
    <div id="loginScreen" class="screen active">
        <div class="glass-card login-card">
            <div class="logo-container">
                <i class="fa-solid fa-shield-halved"></i>
            </div>
            <h2>Admin Login</h2>
            <p>Enter your website password</p>
            <div class="input-group">
                <i class="fa-solid fa-lock"></i>
                <input type="password" id="passwordInput" placeholder="Password">
            </div>
            <button id="loginBtn" class="btn primary-btn">Login</button>
            <p id="loginError" class="error-msg"></p>
        </div>
    </div>

    <!-- Main App Screen -->
    <div id="appScreen" class="screen">
        <header class="app-header">
            <h1>VPN Config Hub</h1>
        </header>

        <div class="content-area">
            <!-- Home Tab -->
            <div id="homeTab" class="tab-content active">
                <div class="glass-card status-card">
                    <div class="status-icon">
                        <i class="fa-solid fa-server"></i>
                    </div>
                    <h3>GitHub Config Status</h3>
                    
                    <div class="info-grid">
                        <div class="info-item">
                            <span class="label">GitHub Repo</span>
                            <span class="value mono" id="lblRepo">--</span>
                        </div>
                        <div class="info-item">
                            <span class="label">JSON File</span>
                            <span class="value mono" id="lblPath">--</span>
                        </div>
                    </div>
                </div>

                <div class="glass-card config-card">
                    <h3>Current File Content</h3>
                    <pre id="configPreview">--</pre>
                </div>

                <div class="glass-card link-card">
                    <h3>GitHub Raw Link</h3>
                    <p class="subtitle">Use this GitHub raw URL in your VPN app for update checks.</p>
                    <div class="copy-box">
                        <input type="text" id="rawLinkInput" readonly value="">
                        <button id="copyBtn" title="Copy Link"><i class="fa-solid fa-copy"></i></button>
                        <button id="openRawBtn" title="Open Raw Link"><i class="fa-solid fa-arrow-up-right-from-square"></i></button>
                    </div>
                </div>
            </div>

            <!-- Update Tab -->
            <div id="updateTab" class="tab-content">
                <div class="glass-card">
                    <h3>Push New Config</h3>
                    <p class="subtitle">Only this box content will be saved into your GitHub JSON file.</p>

                    <div class="input-group">
                        <label>Update Text</label>
                        <textarea id="configInput" placeholder="Paste your update text here..." rows="10"></textarea>
                    </div>

                    <button id="updateBtn" class="btn primary-btn">
                        <i class="fa-solid fa-cloud-arrow-up"></i> Update Configuration
                    </button>
                    <p id="updateMessage" class="msg"></p>
                </div>
            </div>
        </div>

        <!-- Bottom Taskbar -->
        <nav class="bottom-nav">
            <button class="nav-item active" data-target="homeTab">
                <i class="fa-solid fa-house"></i>
                <span>Home</span>
            </button>
            <button class="nav-item" data-target="updateTab">
                <i class="fa-solid fa-arrows-rotate"></i>
                <span>Update</span>
            </button>
        </nav>
    </div>

    <script src="script.js"></script>
</body>
</html>
